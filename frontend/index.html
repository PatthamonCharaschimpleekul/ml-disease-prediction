<!DOCTYPE html>
<html>

<head>
<title>Disease Prediction</title>
</head>

<body>

<h2>Disease Prediction System</h2>

<input id="symptoms" placeholder="Enter symptoms separated by comma">

<button onclick="predict()">Predict</button>

<div id="result"></div>

<script>

async function predict(){

    let symptoms = document.getElementById("symptoms").value.split(",")

    let response = await fetch("/predict",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({symptoms:symptoms})
    })

    let data = await response.json()

    let resultHTML=""

    data.forEach(d => {

        resultHTML += `
        <h3>${d.disease}</h3>
        <p>Confidence: ${d.confidence}</p>
        <p>${d.description}</p>
        `
    })

    document.getElementById("result").innerHTML=resultHTML
}

</script>

</body>
</html>
